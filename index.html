<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SmartBoard AI — Professional Classroom Whiteboard</title>
    <meta name="description" content="SmartBoard AI — an AI-powered bilingual classroom whiteboard with Smart Lab, Atlas, PDF learning tools and AI Teacher Agent." />
    <link rel="icon" type="image/png" href="/smartboard-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=El+Messiri:wght@500;600;700&family=Cairo:wght@400;500;600;700;800&family=Kalam:wght@400;700&family=Playpen+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.10.4/dist/style.css" />
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"IBM Plex Sans Arabic"', 'Inter', '"Cairo"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              arabic: ['"IBM Plex Sans Arabic"', '"Cairo"', 'sans-serif'],
              numbers: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'sans-serif'],
              display: ['"Space Grotesk"', '"El Messiri"', '"Cairo"', 'sans-serif'],
              displayAr: ['"El Messiri"', '"Cairo"', 'sans-serif'],
              body: ['"IBM Plex Sans Arabic"', 'Inter', '"Cairo"', 'sans-serif'],
              hand: ['"Kalam"', 'cursive'],
              arabicHand: ['"Playpen Sans Arabic"', 'cursive'],
            },
            colors: {
              board: '#f8fafc',
              toolbar: '#080D1E',
              accent: '#00E5FF',
              surface: '#ffffff',
              'on-surface': '#0f172a',
              'surface-variant': '#f1f5f9',
              primary: '#059669',
              secondary: '#10b981',
              tonal: '#d1fae5',
              'orbital-cyan': '#00E5FF',
              'starlight-amber': '#F59E0B',
              'emerald-save': '#10B981',
              'cosmic-dark': '#080D1E',
            },
            borderRadius: {
              xl: '1rem',
              '2xl': '1.25rem',
              '3xl': '1.5rem',
            },
            boxShadow: {
              'elev-0': 'none',
              'elev-1': '0 1px 3px 0 rgba(15, 23, 42, 0.08), 0 1px 2px -1px rgba(15, 23, 42, 0.08)',
              'elev-2': '0 4px 6px -1px rgba(15, 23, 42, 0.1), 0 2px 4px -2px rgba(15, 23, 42, 0.08)',
              'elev-3': '0 10px 15px -3px rgba(15, 23, 42, 0.12), 0 4px 6px -4px rgba(15, 23, 42, 0.08)',
              'elev-12': '0 20px 25px -5px rgba(15, 23, 42, 0.15), 0 8px 10px -6px rgba(15, 23, 42, 0.1)',
            },
            transitionTimingFunction: {
              'out-expo': 'cubic-bezier(0.16, 1, 0.3, 1)',
            },
            animation: {
              'fade-in-down': 'fade-in-down 0.25s cubic-bezier(0.16, 1, 0.3, 1) both',
              'fade-in': 'fade-in 0.2s ease-out both',
            },
            keyframes: {
              'fade-in-down': {
                '0%': { opacity: '0', transform: 'translateY(-12px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
            },
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', 'Cairo', sans-serif;
        background-color: #0f172a;
        color: #0f172a;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      textarea, input, [contenteditable="true"] {
        user-select: text;
        -webkit-user-select: text;
      }
      
      #root { width: 100%; height: 100%; }
      .font-ar { font-family: 'Playpen Sans Arabic', cursive; }
      .font-en { font-family: 'Kalam', cursive; }

      .font-display {
        font-family: 'Space Grotesk', 'El Messiri', 'Cairo', sans-serif;
        letter-spacing: -0.02em;
      }
      .font-display-ar {
        font-family: 'El Messiri', 'Cairo', sans-serif;
      }

      .react-flow__node { border: none !important; background: transparent !important; width: auto !important; }
      .react-flow__handle { width: 8px; height: 8px; background: #059669; }

      .material-symbols-rounded {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        font-size: 24px;
        line-height: 1;
        user-select: none;
      }
      .ms-fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

      .mat-btn { transition: all .15s cubic-bezier(0.16, 1, 0.3, 1); }
      .mat-btn:active { transform: scale(.97); }
      .mat-btn--active { background-color: #059669 !important; color: #ffffff !important; }

      .board-canvas { background: radial-gradient(circle at 1px 1px, rgba(148,163,184,.22) 1px, transparent 1.4px) 0 0/24px 24px, #ffffff; }

      .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }
      .scroll-thin::-webkit-scrollbar-thumb { background: rgba(148,163,184,.4); border-radius: 999px; }
      
      .cursor-pen { cursor: crosshair !important; }
      .cursor-eraser { cursor: cell !important; }
    </style>
<script type="importmap">
{
