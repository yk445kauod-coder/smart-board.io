<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SmartBoard AI — Classroom Whiteboard</title>
    <meta name="description" content="SmartBoard AI — an AI-powered bilingual classroom whiteboard with Smart Lab, Atlas and PDF learning tools." />
    <link rel="icon" type="image/png" href="/smartboard-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=El+Messiri:wght@400;500;600;700&family=Cairo:wght@300;400;500;600;700;800&family=Kalam:wght@300;400;700&family=Patrick+Hand&family=Playpen+Sans+Arabic:wght@100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.10.4/dist/style.css" />
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '"Cairo"', 'sans-serif'],
              display: ['"Space Grotesk"', '"El Messiri"', 'sans-serif'],
              displayAr: ['"El Messiri"', '"Cairo"', 'sans-serif'],
              body: ['Manrope', '"Cairo"', 'sans-serif'],
              hand: ['"Patrick Hand"', '"Kalam"', 'cursive'],
              arabicHand: ['"Playpen Sans Arabic"', 'cursive'],
            },
            colors: {
              board: '#fdfbf7',
              toolbar: '#2d3436',
              accent: '#6c5ce7',
              surface: '#ffffff',
              'on-surface': '#1c1b1f',
              'surface-variant': '#e7e0ec',
              primary: '#6c5ce7',
              secondary: '#7d6ef2',
              tonal: '#eaddff',
            },
            borderRadius: {
              xl: '1rem',
              '2xl': '1.25rem',
              '3xl': '1.5rem',
            },
            boxShadow: {
              'elev-0': 'none',
              'elev-1': '0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15)',
              'elev-2': '0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15)',
              'elev-3': '0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.3)',
              'elev-12': '0 8px 12px 6px rgba(0,0,0,.15), 0 4px 4px rgba(0,0,0,.3)',
            },
            transitionTimingFunction: {
              'out-expo': 'cubic-bezier(0.16, 1, 0.3, 1)',
            },
            animation: {
              'fade-in-down': 'fade-in-down 0.3s ease-out both',
              'fade-in': 'fade-in 0.3s ease-out both',
              'blob': 'blob 7s infinite',
              'float': 'float 6s ease-in-out infinite',
              'float-delayed': 'float 6s ease-in-out 3s infinite',
              'float-fast': 'float 4s ease-in-out infinite',
            },
            keyframes: {
              'fade-in-down': {
                '0%': { opacity: '0', transform: 'translateY(-10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              blob: {
                "0%": { transform: "translate(0px, 0px) scale(1)" },
                "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                "100%": { transform: "translate(0px, 0px) scale(1)" }
              },
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-20px)" }
              }
            },
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Manrope', 'Cairo', sans-serif;
        background-color: #f0f2f5;
        color: #2d3436;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
      }

      textarea, input, [contenteditable="true"] {
        user-select: text;
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
      }
      
      #root { width: 100%; height: 100%; }
      .font-ar { font-family: 'Playpen Sans Arabic', cursive; }
      .font-en { font-family: 'Kalam', cursive; }

      /* Cinematic display typography */
      .font-display {
        font-family: 'Space Grotesk', 'El Messiri', 'Cairo', sans-serif;
        letter-spacing: -0.02em;
        font-weight: 700;
      }
      .font-display-ar {
        font-family: 'El Messiri', 'Cairo', sans-serif;
        font-weight: 700;
        letter-spacing: 0;
      }
      .font-display-aw {
        font-family: 'Space Grotesk', 'El Messiri', 'Cairo', sans-serif;
        -webkit-text-stroke: 1.5px rgba(255,255,255,0.5);
      }
      .font-body {
        font-family: 'Manrope', 'Cairo', sans-serif;
      }
      /* Big cinematic hero title */
      .cinematic-hero {
        font-family: 'Space Grotesk', 'El Messiri', 'Cairo', sans-serif;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
        background: linear-gradient(135deg, #fff 0%, #eaddff 55%, #b8a6ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 18px rgba(108,92,231,0.35));
      }
      .cinematic-hero-ar {
        font-family: 'El Messiri', 'Cairo', sans-serif;
        font-weight: 700;
        line-height: 1.25;
        background: linear-gradient(135deg, #fff 0%, #eaddff 55%, #b8a6ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 18px rgba(108,92,231,0.35));
      }
      .react-flow__node { border: none !important; background: transparent !important; width: auto !important; }
      .react-flow__handle { width: 8px; height: 8px; background: #6c5ce7; }

      /* Material Symbols (filled, themeable) */
      .material-symbols-rounded {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        font-size: 24px;
        line-height: 1;
        user-select: none;
      }
      .ms-fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

      /* Material ripple-ish press */
      .mat-btn { transition: background-color .2s ease, box-shadow .2s ease, transform .1s ease; }
      .mat-btn:active { transform: scale(.96); }
      .mat-btn--active { background-color: #eaddff !important; color: #4a3f9e !important; }

      .board-canvas { background: radial-gradient(circle at 1px 1px, rgba(120,120,120,.18) 1px, transparent 1.4px) 0 0/24px 24px, #ffffff; }

      /* Scrollbars for sheets */
      .scroll-thin::-webkit-scrollbar { width: 6px; height: 6px; }
      .scroll-thin::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 999px; }
      
      .cursor-pen { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.5 8.6L13 18l5-5"/></svg>') 0 24, crosshair !important; }
      .cursor-eraser { cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="white" stroke="black" stroke-width="1.5"><rect x="5" y="5" width="14" height="14" rx="1" /></svg>') 12 12, crosshair !important; }

      /* SmartBoard signature: pixel-art UI chrome only. Board canvas and board elements stay smooth. */
      button, input, textarea, select, .mat-btn, [role="button"] {
        border-radius: 0 !important;
        image-rendering: pixelated;
      }
      button, .mat-btn, [role="button"] {
        border: 2px solid currentColor;
        box-shadow: 3px 3px 0 rgba(16, 24, 40, .28);
        transition: transform .08s steps(2), box-shadow .08s steps(2), filter .08s steps(2);
      }
      button:hover, .mat-btn:hover, [role="button"]:hover { filter: brightness(1.08); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 rgba(16, 24, 40, .3); }
      button:active, .mat-btn:active, [role="button"]:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(16, 24, 40, .25); }
      input, textarea, select { border: 2px solid rgba(16, 24, 40, .35) !important; box-shadow: inset 2px 2px 0 rgba(16, 24, 40, .08); }
      .pixel-panel { border: 3px solid #172554; box-shadow: 6px 6px 0 rgba(15, 23, 42, .24); border-radius: 0 !important; }
      .pixel-badge { border: 2px solid currentColor; border-radius: 0 !important; box-shadow: 2px 2px 0 rgba(15, 23, 42, .22); }
      .material-symbols-rounded, i, .fa-solid, .fa-regular { image-rendering: pixelated; }
    </style>
<script type="importmap">
{

</script>

</html>
